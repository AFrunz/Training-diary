appId: com.trainingdiary.app
name: От пустого приложения до статистики
---
- launchApp:
    clearState: true

# Идентификаторы карточек и дней строятся из даты, поэтому она считается заранее
- evalScript: ${output.today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10)}

# Два упражнения в библиотеке
- tapOn:
    id: 'tab-library'
- tapOn:
    id: 'library-segment-exercises'
- tapOn:
    id: 'add-button'
- tapOn:
    id: 'name-input'
- inputText: 'Жим лёжа'
- tapOn:
    id: 'create-button'
- assertVisible: 'Жим лёжа'

- tapOn:
    id: 'add-button'
- tapOn:
    id: 'name-input'
- inputText: 'Разводка гантелей'
- tapOn:
    id: 'create-button'
- assertVisible: 'Разводка гантелей'

# Программа из этих упражнений
- tapOn:
    id: 'library-segment-programs'
- tapOn:
    id: 'add-button'
# пока название пустое, создать нельзя (FR-3.1.1)
- assertVisible:
    id: 'create-button'
    enabled: false
- tapOn:
    id: 'name-input'
- inputText: 'Грудь + трицепс'
- tapOn:
    id: 'exercise-picker-open'
- tapOn:
    id: 'exercise-row-Жим лёжа'
- tapOn:
    id: 'exercise-row-Разводка гантелей'
- tapOn:
    id: 'exercise-picker-done'
- tapOn:
    id: 'create-button'
# созданная программа сразу открывается своим экраном; «+» в названии — метасимвол
# регулярного выражения, поэтому в селекторах экранируется
- assertVisible:
    id: 'program-screen'
- assertVisible: 'Грудь \+ трицепс'
- tapOn:
    id: 'header-back'

# Тренировка на сегодня: «＋» ведёт на выбор программы
- tapOn:
    id: 'tab-workouts'
- tapOn:
    id: 'add-button'
- tapOn:
    id: 'program-option-Грудь \+ трицепс'
- assertVisible:
    id: 'workout-timer'

# Подход к первому упражнению
- tapOn:
    id: 'add-set-0'
- tapOn:
    id: 'set-weight-input'
- inputText: '80'
- tapOn:
    id: 'set-reps-input'
- inputText: '8'
- tapOn:
    id: 'set-submit'
- assertVisible: '80 × 8'

# Отмечено одно упражнение из двух. Пока отмечены не все, сегодняшняя тренировка
# закреплена сверху отдельной карточкой, а не лежит в ленте по дате (§5.2).
# Экран тренировки закрывает таббар, поэтому в список — через «назад».
- tapOn:
    id: 'item-checkbox-0'
- tapOn:
    id: 'header-back'
- assertVisible:
    id: 'active-workout-card'
- assertVisible: '1/2'

# Отмечаем второе — тренировка завершена и уходит в ленту под своей датой
- tapOn:
    id: 'active-workout-card'
- tapOn:
    id: 'item-checkbox-1'
- tapOn:
    id: 'header-back'
- assertNotVisible:
    id: 'active-workout-card'
- assertVisible:
    id: 'workout-card-${output.today}'
- assertVisible: '2/2'

# Тренировка видна в календаре (точка программы в сегодняшнем дне) и в статистике
- tapOn:
    id: 'tab-calendar'
- assertVisible:
    id: 'calendar-day-${output.today}'
- assertVisible:
    id: 'calendar-dot-${output.today}'
- tapOn:
    id: 'tab-stats'
- assertVisible:
    id: 'stat-workouts'
