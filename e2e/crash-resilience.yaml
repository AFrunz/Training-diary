appId: com.trainingdiary.app
name: Подходы переживают убийство процесса (§7.1)
---
- runFlow: fixtures/seed-program.yaml

# Начинаем тренировку и записываем два подхода.
# «＋» в списке тренировок ведёт на выбор программы; «+» в названии — метасимвол
# регулярного выражения, поэтому в селекторе экранируется.
- tapOn:
    id: 'tab-workouts'
- tapOn:
    id: 'add-button'
- tapOn:
    id: 'program-option-Грудь \+ трицепс'
- assertVisible:
    id: 'workout-timer'

- tapOn:
    id: 'add-set-0'
- tapOn:
    id: 'set-weight-input'
- inputText: '80'
- tapOn:
    id: 'set-reps-input'
- inputText: '8'
- tapOn:
    id: 'set-submit'

- tapOn:
    id: 'add-set-0'
- tapOn:
    id: 'set-weight-input'
- inputText: '82.5'
- tapOn:
    id: 'set-reps-input'
- inputText: '6'
- tapOn:
    id: 'set-submit'

- assertVisible: '82.5 × 6'

# Убиваем процесс без каких-либо «сохранить»
- stopApp
- launchApp:
    clearState: false

# Тренировка на месте: ни одно упражнение не отмечено, поэтому она по-прежнему
# закреплена сверху списка как незавершённая, а не лежит в ленте по дате (§5.2)
- tapOn:
    id: 'tab-workouts'
- assertVisible:
    id: 'active-workout-card'
- tapOn:
    id: 'active-workout-card'

# Оба подхода целы, счётчик продолжает идти
- assertVisible: '80 × 8'
- assertVisible: '82.5 × 6'
- assertVisible:
    id: 'workout-timer'
