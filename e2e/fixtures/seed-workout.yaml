appId: com.trainingdiary.app
name: Подготовка — проведённая тренировка
---
- runFlow: seed-program.yaml

- tapOn:
    id: 'tab-workouts'
- tapOn:
    id: 'add-button'
# «＋» ведёт на выбор программы; «+» в названии — метасимвол регулярного выражения
- tapOn:
    id: 'program-option-Грудь \+ трицепс'
- assertVisible:
    id: 'workout-timer'

- tapOn:
    id: 'add-set-0'
- tapOn:
    id: 'set-weight-input'
- inputText: '80'
- tapOn:
    id: 'set-reps-input'
- inputText: '8'
- tapOn:
    id: 'set-submit'

- tapOn:
    id: 'item-checkbox-0'
- tapOn:
    id: 'item-checkbox-1'

# Экран тренировки лежит поверх таббара, поэтому фикстура возвращается в список:
# иначе следующий шаг сценария не достучится до вкладок.
- tapOn:
    id: 'header-back'
- assertVisible:
    id: 'workouts-screen'
