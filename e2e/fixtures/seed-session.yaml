appId: com.trainingdiary.app
name: Подготовка — программа из трёх упражнений
---
- launchApp:
    clearState: true

# Третье упражнение — без снаряда: к нему пойдёт подход без веса
- tapOn:
    id: 'tab-library'
- tapOn:
    id: 'add-button'
- tapOn:
    id: 'name-input'
- inputText: 'Жим лёжа'
- tapOn:
    id: 'create-button'

- tapOn:
    id: 'add-button'
- tapOn:
    id: 'name-input'
- inputText: 'Разводка гантелей'
- tapOn:
    id: 'create-button'

- tapOn:
    id: 'add-button'
- tapOn:
    id: 'name-input'
- inputText: 'Отжимания'
- tapOn:
    id: 'create-button'

# Порядок упражнений в программе — порядок отметок в выборе,
# из него же берутся индексы строк тренировки: 0, 1, 2
- tapOn:
    id: 'library-segment-programs'
- tapOn:
    id: 'add-button'
- tapOn:
    id: 'name-input'
- inputText: 'Верх тела'
- tapOn:
    id: 'exercise-picker-open'
- tapOn:
    id: 'exercise-row-Жим лёжа'
- tapOn:
    id: 'exercise-row-Разводка гантелей'
- tapOn:
    id: 'exercise-row-Отжимания'
- tapOn:
    id: 'exercise-picker-done'
- tapOn:
    id: 'create-button'
