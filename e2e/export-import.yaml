appId: com.trainingdiary.app
name: Экспорт, полная очистка, импорт (критерий приёмки 10)
---
# ВНИМАНИЕ: сценарий проходит до выбора файла при импорте. Экспорт, полная
# очистка и выбор режима импорта наружу выведены — app/(tabs)/settings.tsx
# передаёт onImportRequested и onWipeConfirmed, — но после режима открывается
# системный выбор файла, а выгрузка уходит в «Поделиться» и в известном месте
# не лежит: указать её шагом Maestro нечем. Всё, что ниже выбора режима, —
# контракт, к которому идём; до этого сценарий держим отдельно от прогона
# всей папки.
- runFlow: fixtures/seed-workout.yaml

# Карточки тренировок именуются датой, поэтому она считается заранее
- evalScript: ${output.today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10)}

# Запоминаем, что было до выгрузки. Подходы видны только на экране тренировки,
# поэтому карточка открывается; «+» в названии экранируется.
- tapOn:
    id: 'tab-workouts'
- assertVisible: 'Грудь \+ трицепс'
- tapOn:
    id: 'workout-card-${output.today}'
- assertVisible: '80 × 8'
- tapOn:
    id: 'header-back'

# Выгружаем файл: имя лежит подсказкой в строке экспорта, после нажатия
# подсказка сменяется на «файл готов к сохранению»
- tapOn:
    id: 'tab-settings'
- assertVisible:
    id: 'settings-export-subtitle'
    text: 'training-diary-.*\.json'
- tapOn:
    id: 'settings-export'
- assertVisible:
    id: 'settings-export-subtitle'
    text: 'файл готов к сохранению'

# Стираем всё: строка в «Опасной зоне» ничего не запускает — это пояснение.
# Решает ползунок: его тянут до правого края, и только тогда появляется кнопка
# подтверждения. Свайп начинается от ручки — Maestro ведёт палец от элемента
# до 90 % ширины экрана, и от середины дорожки хода не хватит.
- scrollUntilVisible:
    element:
      id: 'settings-wipe-slider'
- assertVisible:
    id: 'settings-wipe-subtitle'
    text: 'действие необратимо'
- swipe:
    from:
      id: 'settings-wipe-knob'
    direction: RIGHT
- assertVisible:
    id: 'settings-wipe-confirm'
- tapOn:
    id: 'settings-wipe-confirm'
- tapOn:
    id: 'tab-workouts'
- assertVisible:
    id: 'workouts-empty'
- assertNotVisible: 'Грудь \+ трицепс'

# Возвращаем из файла. Режим спрашивается системным диалогом до выбора файла
# (FR-7.2), а дальше открывается системный выбор файла — туда сценарий уже
# не дотягивается. Настройки остались прокрученными к опасной зоне,
# поэтому сначала вверх.
- tapOn:
    id: 'tab-settings'
- scrollUntilVisible:
    element:
      id: 'settings-import'
    direction: UP
- tapOn:
    id: 'settings-import'
- tapOn: 'Заменить всё'

# Состояние совпадает с исходным, включая подходы
- tapOn:
    id: 'tab-workouts'
- assertVisible: 'Грудь \+ трицепс'
- tapOn:
    id: 'workout-card-${output.today}'
- assertVisible: '80 × 8'
