appId: com.trainingdiary.app
name: Проведение тренировки — подходы, отметки, завершение (FR-4.2–FR-4.4, §5.2)
---
- runFlow: fixtures/seed-session.yaml
# Карточка и бублик в списке тренировок опознаются по дате
- evalScript: ${output.today = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10)}

# Тренировка на сегодня: счётчик пошёл с первой секунды
- tapOn:
    id: 'tab-workouts'
- tapOn:
    id: 'add-button'
- tapOn:
    id: 'program-option-Верх тела'
- assertVisible:
    id: 'workout-timer'

# Первый подход вводится руками: подсказывать ещё нечего
- tapOn:
    id: 'add-set-0'
- tapOn:
    id: 'set-weight-input'
- inputText: '80'
- tapOn:
    id: 'set-reps-input'
- inputText: '8'
- tapOn:
    id: 'set-submit'
- assertVisible: '80 × 8'

# Второй подход предзаполнен прошлым (FR-4.4), степперы правят вес на 2.5 кг, повторы — на единицу
- tapOn:
    id: 'add-set-0'
- assertVisible:
    id: 'set-weight-input'
    text: '80'
- assertVisible:
    id: 'set-reps-input'
    text: '8'
- assertVisible: 'Прошлый раз: 80 × 8'
- tapOn:
    id: 'set-weight-plus'
- tapOn:
    id: 'set-reps-minus'
- assertVisible:
    id: 'set-weight-input'
    text: '82\.5'
- assertVisible:
    id: 'set-reps-input'
    text: '7'
- tapOn:
    id: 'set-submit'
- assertVisible: '82\.5 × 7'

# Правка подхода по тапу (FR-4.4.1): значения берутся из него самого
- tapOn:
    id: 'set-chip-0-1'
- assertVisible: 'Правка подхода'
- assertVisible:
    id: 'set-weight-input'
    text: '82\.5'
- tapOn:
    id: 'set-reps-input'
- eraseText
- inputText: '6'
- tapOn:
    id: 'set-submit'
- assertVisible: '82\.5 × 6'

# Третье упражнение без снаряда: вес не трогаем, подход показывается как «× N»
- tapOn:
    id: 'add-set-2'
- tapOn:
    id: 'set-reps-input'
- inputText: '12'
- tapOn:
    id: 'set-submit'
- assertVisible: '× 12'

# Угол вместо веса (FR-4.11): единица своя у подхода и подписывается в чипе
- tapOn:
    id: 'add-set-1'
- tapOn:
    id: 'set-unit-deg'
- tapOn:
    id: 'set-weight-input'
- inputText: '45'
- tapOn:
    id: 'set-reps-input'
- inputText: '15'
- tapOn:
    id: 'set-submit'
- assertVisible: '45° × 15'

# Лишний подход удаляется из того же окна правки
- tapOn:
    id: 'set-chip-1-0'
- tapOn:
    id: 'set-delete'
- assertNotVisible: '45° × 15'

# Отметка первого упражнения: в списке тренировок доля стала 1/3
# (экран тренировки лежит поверх таббара, поэтому сначала «назад»)
- tapOn:
    id: 'item-checkbox-0'
- tapOn:
    id: 'header-back'
# подпись лежит в отдельном узле внутри бублика, поэтому id и текст проверяются порознь
- assertVisible:
    id: 'workout-donut-${output.today}'
- assertVisible: '1/3'

# Отмечаем оставшиеся: тренировка завершена, бублик закрыт целиком
- tapOn:
    id: 'active-workout-card'
- tapOn:
    id: 'item-checkbox-1'
- tapOn:
    id: 'item-checkbox-2'
- tapOn:
    id: 'header-back'

# Завершённая уходит из активных в ленту прошлых
- assertVisible:
    id: 'workout-card-${output.today}'
- assertVisible:
    id: 'workout-donut-${output.today}'
- assertVisible: '3/3'
- assertNotVisible: 'не завершена'

# Завершённую тренировку можно дополнить упражнением сверх программы (FR-4.6)
- tapOn:
    id: 'workout-card-${output.today}'
- tapOn:
    id: 'add-exercise'
- tapOn:
    id: 'exercise-row-Планка'
- tapOn:
    id: 'exercise-picker-done'
- assertVisible:
    id: 'item-checkbox-3'

# Тренировку можно удалить целиком — например, если начал её по ошибке (FR-4.7)
- tapOn:
    id: 'workout-delete'
- assertVisible: 'Удалить тренировку?'
- tapOn:
    id: 'delete-workout-cancel'
- tapOn:
    id: 'workout-delete'
- tapOn:
    id: 'delete-workout-confirm'
- assertVisible:
    id: 'workouts-empty'
