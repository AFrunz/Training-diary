name: Зависимости

# expo-doctor сверяет версии пакетов со списком, который живёт в реестре Expo,
# а не в репозитории. Поэтому проверка краснеет сама по себе — на коммите,
# который ничего не менял, просто вышли патчи SDK. В гейте на каждый пуш ей не
# место: она про окружение, а не про изменение. Раз в неделю — в самый раз.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  doctor:
    name: Версии пакетов под SDK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить конфигурацию проекта
        run: npx expo-doctor@latest
