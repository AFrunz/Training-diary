name: Тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Одновременный прогон одной ветки не нужен: свежий коммит отменяет предыдущий
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Типы и тесты
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить типы
        run: npx tsc --noEmit

      - name: Прогнать тесты
        # тестовый драйвер базы работает на встроенном в Node node:sqlite
        run: npm test -- --ci --json --outputFile=jest-report.json

      # логи Actions скачиваются только с токеном, а сводка видна всем:
      # по красному прогону должно быть сразу понятно, что именно упало
      - name: Показать упавшие тесты
        if: failure()
        run: node scripts/report-failed-tests.mjs jest-report.json >> "$GITHUB_STEP_SUMMARY"

      - name: Собрать бандл
        # ловит то, что не видят тесты: ошибки импортов и конфигурации сборщика
        run: npx expo export --platform android --output-dir /tmp/export
